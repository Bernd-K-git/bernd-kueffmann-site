focusAreas:
  eyebrow: Focus Areas
  heading: Where the work concentrates.
  items:
    - title: Transition Management
      text: Service migrations, vendor changes, organizational hand-overs. The work is to keep operations stable while the structure changes underneath. Most programs lose time here; method and discipline win it back.
    - title: Operational Excellence
      text: Delivery as a working system rather than a sequence of heroics. Clear KPIs, governance that actually decides, processes that survive contact with reality. A continuous-improvement loop that closes.
    - title: Recovery & Stabilization
      text: Honest diagnosis under pressure. Stakeholder realignment, replanning against reality rather than against the original commitment. The art is calm judgment in a moment of scrutiny.
    - title: Global Delivery & Shoring
      text: Designing and running delivery models across locations and time zones. Coordination, quality, cultural fit — for teams that may never meet in person. More than a location choice; a way of working.
    - title: Delivery Governance
      text: KPI transparency, escalation paths that actually move things, executive reporting that informs decisions instead of decorating slides. Steering committees that steer.
    - title: Delivery Optimization
      text: Once delivery is stable, the next question is efficiency. Fixed-price models, service catalogs, industrialization, automation — applied where they earn their place, not as ideology.

